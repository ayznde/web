<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="forms_style.css">
        <title>Authorization</title>
    </head>

    <body>
        <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
            <div class="auth">
                <h1>Авторизация</h1>

                <div class="login">
                    <label class="label" for="login">Введите логин:</label>
                    <input id="login_input" type="text" placeholder="login" name="login">
                </div>
                <div class="password">
                    <label class="label" for="password">Введите пароль:</label>
                    <input id="password_input" type="password" placeholder="password" name="password">
                </div>
                <div>
                    <label for="remember_me">Запомнить меня</label>
                    <input type="checkbox" id="remember_me" name="checkbox_remember">
                </div>
                <button type="submit">Авторизоваться</button>
            </div>
        </form>
    </body>
</html>
